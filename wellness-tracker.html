<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FC5200">
<title>EMBER — Daily Wellness Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7FA; --card:#FFFFFF; --ink:#242428; --ink-2:#63636C; --ink-3:#9B9BA5;
    --line:#DFDFE8; --accent:#FC5200; --accent-press:#D94700; --accent-soft:#FFEFE6;
    --on-accent:#FFFFFF;
    --hm0:#ECECF2; --hm1:#FFDCCB; --hm2:#FFAD84; --hm3:#FD7E44; --hm4:#FC5200;
    --bg2:#F2F2F6;
    --shadow:0 1px 2px rgba(20,20,25,.04);
    --sheet-shadow:0 -8px 40px rgba(20,20,25,.18);
  }
  [data-theme="dark"]{
    --bg:#111113; --card:#1A1A1C; --ink:#F4F4F6; --ink-2:#A8A8B0; --ink-3:#6E6E78;
    --line:#2B2B30; --accent:#FC5200; --accent-press:#FF6B1F; --accent-soft:#2C1a10;
    --hm0:#242428; --hm1:#5A2E1B; --hm2:#8A421D; --hm3:#C2551A; --hm4:#FC5200;
    --bg2:#222226;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --sheet-shadow:0 -8px 40px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:400 15px/1.5 "Barlow",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  body::before{ /* subtle top wash */
    content:""; position:fixed; inset:0 0 auto 0; height:220px; pointer-events:none; z-index:0;
    background:radial-gradient(120% 100% at 50% -20%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%);
  }
  .app{position:relative; z-index:1; max-width:480px; margin:0 auto; padding:14px 16px calc(92px + env(safe-area-inset-bottom))}

  /* ---------- type helpers ---------- */
  .cond{font-family:"Barlow Condensed",sans-serif}
  .kicker{font:600 19px/1.2 "Barlow",sans-serif; color:var(--ink); padding-bottom:13px; border-bottom:1px solid var(--line); margin-bottom:6px}
  .section-t{font:600 11.5px "Barlow",sans-serif; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2); margin:24px 0 10px}
  .section-t:first-child{margin-top:0}

  /* ---------- header ---------- */
  header{display:flex; align-items:center; justify-content:space-between; padding:2px 0 18px}
  .logo{display:flex; align-items:center; gap:7px; font-family:"Barlow Condensed"; font-weight:700; font-size:22px; letter-spacing:.2em; text-transform:uppercase}
  .logo svg{width:20px;height:20px;color:var(--accent)}
  .icon-btn{
    display:flex;align-items:center;justify-content:center; width:38px;height:38px; border-radius:12px;
    border:1px solid var(--line); background:var(--card); color:var(--ink-2); cursor:pointer;
    transition:transform .12s ease, background .15s;
  }
  .icon-btn:active{transform:scale(.93)}
  .icon-btn svg{width:18px;height:18px}

  /* ---------- cards ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow)}

  /* ---------- orange streak header ---------- */
  .hero-orange{
    background:var(--accent); border-radius:12px; padding:15px 18px 17px; color:#fff; margin-top:6px;
    box-shadow:0 6px 20px color-mix(in srgb, var(--accent) 28%, transparent);
  }
  .ho-date{font:600 12px "Barlow",sans-serif; letter-spacing:.1em; text-transform:uppercase; opacity:.88}
  .ho-streak{display:flex; align-items:baseline; gap:8px; font:500 15px "Barlow",sans-serif; margin-top:3px}
  .ho-streak b{font:700 42px/1 "Barlow",sans-serif; letter-spacing:-.02em}

  /* ---------- activity tiles ---------- */
  .act-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .act-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; padding:16px 8px 14px;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    color:var(--ink); font:600 13.5px "Barlow",sans-serif; cursor:pointer; text-align:center;
    transition:transform .1s ease, background .15s, border-color .15s, color .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .act-btn svg{width:22px;height:22px; flex:none; color:var(--ink-2); transition:color .15s}
  .act-btn span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .act-btn:active{transform:scale(.96)}
  .act-btn[aria-pressed="true"]{
    background:var(--accent); border-color:var(--accent); color:var(--on-accent);
    box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent);
    animation:pop .28s cubic-bezier(.3,1.6,.5,1);
  }
  .act-btn[aria-pressed="true"] svg{color:var(--on-accent)}
  @keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  .act-btn.planned{border:1.5px dashed color-mix(in srgb, var(--accent) 65%, transparent)}
  .act-btn.planned svg:first-of-type{color:var(--accent)}
  .plan-tag{font:600 10px "Barlow",sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-top:-3px}
  .act-btn[aria-pressed="true"] .plan-tag{display:none}

  /* ---------- save button ---------- */
  .save-btn{
    width:100%; margin-top:12px; padding:14px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font:700 15px "Barlow",sans-serif; cursor:pointer;
    box-shadow:0 4px 14px color-mix(in srgb, var(--accent) 28%, transparent); transition:transform .1s;
  }
  .save-btn:active{transform:scale(.98); background:var(--accent-press)}

  /* ---------- up next (plan ahead) ---------- */
  .plan-row{display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px; background:none; border:none;
    border-top:1px solid var(--line); cursor:pointer; text-align:left; color:var(--ink); font:inherit; -webkit-tap-highlight-color:transparent}
  .plan-row:first-child{border-top:none}
  .plan-row:active{background:color-mix(in srgb, var(--accent) 5%, transparent)}
  .pr-date{font:600 13.5px "Barlow",sans-serif; width:92px; flex:none}
  .pr-chips{flex:1; display:flex; flex-wrap:wrap; gap:6px}
  .pr-none{font-size:13px; color:var(--ink-3)}
  .pr-edit{width:14px !important; height:14px !important; color:var(--ink-3); flex:none}
  .a-chip.plan{background:transparent; border:1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); padding:3.5px 10px 3.5px 7px; font-size:12.5px}

  /* ---------- today's log detail rows ---------- */
  .log-list{display:flex; flex-direction:column}
  .log-row{display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--line)}
  .log-row:first-child{border-top:none}
  .log-row svg{width:18px;height:18px; color:var(--accent); flex:none}
  .log-row .nm{font-weight:600; width:74px; flex:none; font-size:14px}
  .log-row input{
    background:transparent; border:none; border-bottom:1px dashed var(--line); color:var(--ink);
    font:400 14px "Barlow",sans-serif; padding:3px 2px; outline:none; min-width:0;
  }
  .log-row input:focus{border-bottom-color:var(--accent)}
  .log-row input::placeholder{color:var(--ink-3)}
  .log-row .dur{width:52px; text-align:right}
  .log-row .un{font-size:12px; color:var(--ink-3); margin-left:-4px}
  .log-row .note{flex:1}
  .hint{font-size:13px; color:var(--ink-3); margin-top:10px; text-align:center}

  /* ---------- body weight ---------- */
  .w-card{display:flex; align-items:center; gap:12px; padding:13px 16px}
  .w-card > svg{width:20px; height:20px; color:var(--accent); flex:none}
  #weightInput{width:88px; background:transparent; border:none; border-bottom:1px dashed var(--line); color:var(--ink);
    font-family:"Barlow Condensed"; font-weight:700; font-size:27px; padding:0 2px; outline:none; text-align:center;
    -moz-appearance:textfield; appearance:textfield}
  #weightInput::-webkit-outer-spin-button, #weightInput::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  #weightInput:focus{border-bottom-color:var(--accent)}
  #weightInput::placeholder{color:var(--ink-3)}
  .w-unit{background:none; border:1px solid var(--line); border-radius:8px; color:var(--ink-2); font:600 12px "Barlow",sans-serif;
    padding:4px 9px; cursor:pointer; flex:none; transition:color .15s}
  .w-unit:active{color:var(--accent)}
  .w-sub{font-size:12.5px; color:var(--ink-3); margin-left:auto; text-align:right; line-height:1.35}
  .w-sub b{font-weight:600; color:var(--ink-2)}
  .wt-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:8px}
  .wt-diff{font:600 13px "Barlow",sans-serif; color:var(--ink-2); text-align:right}
  .wt-diff span{display:block; font-weight:400; font-size:11px; color:var(--ink-3); margin-top:1px}
  .wt-line{fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .wt-dot{fill:var(--card); stroke:var(--accent); stroke-width:1.5}
  .wt-dot-last{fill:var(--accent)}

  /* ---------- heatmap: 5 big rows, one per week ---------- */
  .hm-wrap{padding:14px}
  .hm-big{display:grid; grid-template-columns:repeat(7,1fr); gap:7px}
  .hm-cell{aspect-ratio:1; width:100%; border-radius:7px; background:var(--hm0); border:none; padding:0; cursor:pointer; transition:transform .1s}
  .hm-cell:active{transform:scale(.9)}
  .hm-cell.future{visibility:hidden}
  .hm-cell.l1{background:var(--hm1)} .hm-cell.l2{background:var(--hm2)}
  .hm-cell.l3{background:var(--hm3)} .hm-cell.l4{background:var(--hm4)}
  .hm-cell.today{outline:2px solid var(--accent); outline-offset:2px}
  .hm-cell.future.planned{visibility:visible; background:transparent; border:1.5px dashed color-mix(in srgb, var(--accent) 65%, transparent)}

  /* ---------- history feed ---------- */
  .feed{display:flex; flex-direction:column; gap:12px}
  .day-card{padding:15px 16px 13px; animation:rise .35s ease both}
  .feed .day-card:nth-child(1){animation-delay:.02s}.feed .day-card:nth-child(2){animation-delay:.06s}
  .feed .day-card:nth-child(3){animation-delay:.1s}.feed .day-card:nth-child(4){animation-delay:.14s}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .day-head{display:flex; align-items:baseline; gap:8px}
  .day-date{font:600 15px "Barlow",sans-serif}
  .day-meta{font-size:12.5px; color:var(--ink-3); margin-left:auto}
  .day-edit{background:none;border:none;color:var(--ink-3);cursor:pointer;padding:4px;margin:-4px -4px -4px 2px;border-radius:8px}
  .day-edit:active{color:var(--accent)}
  .day-edit svg{width:15px;height:15px;display:block}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:10px}
  .a-chip{display:inline-flex; align-items:center; padding:5px 12px; border-radius:8px;
    background:var(--accent-soft); color:var(--ink); font-size:13px; font-weight:600}
  .a-chip small{font-weight:400; font-size:13px; color:var(--ink-2); white-space:pre}
  .day-note{font-size:13.5px; color:var(--ink-2); margin-top:9px; padding-left:10px; border-left:2px solid var(--line)}
  .day-note b{font-weight:600; color:var(--ink)}
  .day-note.miss{color:var(--ink-3); border-left-style:dashed}
  .backfill{display:flex; align-items:center; gap:10px; padding:13px 16px; margin-bottom:14px}
  .backfill label{font-weight:600; font-size:14px}
  .backfill input{margin-left:auto; background:transparent; border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:7px 10px; font:500 14px "Barlow"; color-scheme:inherit}

  /* ---------- trends ---------- */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .tile{padding:14px 16px 12px; background:var(--bg2); border-radius:12px}
  .t-lab{font:600 10.5px "Barlow",sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}
  .t-num{font:700 32px/1.15 "Barlow",sans-serif; letter-spacing:-.02em; margin-top:3px}
  .t-num.o{color:var(--accent)}
  .t-num small{font-size:17px; font-weight:600; color:var(--ink-2); letter-spacing:0}
  .tile .t-sub{font-size:12px; color:var(--ink-3); margin-top:1px}
  .chart-card{padding:16px; margin-top:10px}
  .filter-row{display:flex; gap:7px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none}
  .filter-row::-webkit-scrollbar{display:none}
  .f-chip{flex:none; padding:5px 13px; border-radius:999px; border:1px solid var(--line); background:transparent;
    color:var(--ink-2); font:600 13px "Barlow"; cursor:pointer; transition:all .15s}
  .f-chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  .chart-svg{width:100%; display:block}
  .bar{fill:var(--accent)}
  .bar.cur{fill:var(--hm2)}
  .bar-stub{fill:var(--line)}
  .bar-val{font:600 11px "Barlow"; fill:var(--ink-2)}
  .ax{font:500 10.5px "Barlow"; fill:var(--ink-3)}
  .gridline{stroke:var(--line); stroke-width:1; stroke-dasharray:2 3}
  .baseline{stroke:var(--line); stroke-width:1}
  .m-row{display:flex; align-items:center; gap:12px; padding:10px 16px; border-top:1px solid var(--line); font-size:14px}
  .m-row:first-of-type{border-top:none}
  .m-row .nm{font-family:"Barlow Condensed"; font-weight:600; font-size:15px; letter-spacing:.06em; text-transform:uppercase; width:66px; flex:none}
  .m-row .meter{flex:1; height:8px; border-radius:99px; background:var(--hm0); overflow:hidden}
  .m-row .meter i{display:block; height:100%; background:var(--accent); border-radius:99px}
  .m-row .v{font-weight:600; width:78px; text-align:right; color:var(--ink-2); font-size:12.5px}
  .ba-nm{width:92px; flex:none; font:600 13.5px "Barlow",sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ba-nm small{display:block; font:400 11px "Barlow",sans-serif; color:var(--ink-3); margin-top:1px}
  .ba-v{width:28px; flex:none; text-align:right; font:700 14.5px "Barlow",sans-serif}

  /* ---------- settings ---------- */
  .hdr-btns{display:flex; gap:8px}
  .set-row{display:flex; align-items:center; gap:11px; padding:12px 16px; border-top:1px solid var(--line); font-size:14.5px}
  .set-row:first-child{border-top:none}
  .set-row > svg{width:18px; height:18px; color:var(--ink-2); flex:none}
  .set-row .nm{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sw{position:relative; width:42px; height:25px; border-radius:99px; background:var(--hm0); border:none; cursor:pointer; flex:none; padding:0; transition:background .2s}
  .sw::after{content:""; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:var(--card);
    box-shadow:0 1px 3px rgba(10,10,12,.25); transition:left .2s}
  .sw[aria-checked="true"]{background:var(--accent)}
  .sw[aria-checked="true"]::after{left:20px}
  .x-btn{background:none; border:none; color:var(--ink-3); cursor:pointer; padding:5px; margin:-5px 0; border-radius:8px; flex:none}
  .x-btn:active{color:var(--accent)}
  .x-btn svg{width:15px; height:15px; display:block}
  .add-row input{flex:1; min-width:0; background:transparent; border:none; border-bottom:1px dashed var(--line); color:var(--ink);
    font:400 14px "Barlow",sans-serif; padding:4px 2px; outline:none}
  .add-row input:focus{border-bottom-color:var(--accent)}
  .add-row input::placeholder{color:var(--ink-3)}
  .add-btn{background:var(--accent); color:var(--on-accent); border:none; border-radius:999px; padding:6px 16px; cursor:pointer;
    font-family:"Barlow Condensed"; font-weight:700; font-size:13px; letter-spacing:.1em; text-transform:uppercase; flex:none; transition:transform .1s}
  .add-btn:active{transform:scale(.95)}

  /* ---------- empty state ---------- */
  .empty{padding:34px 24px; text-align:center; color:var(--ink-3)}
  .empty svg{width:34px; height:34px; color:var(--ink-3); opacity:.7; margin-bottom:10px}
  .empty b{display:block; font-family:"Barlow Condensed"; font-weight:600; font-size:17px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); margin-bottom:3px}

  /* ---------- bottom nav ---------- */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
  }
  .nav-in{max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
  .nav-btn{display:flex; align-items:center; justify-content:center; padding:12px 0; background:none; border:none;
    color:var(--ink-3); cursor:pointer; border-radius:12px; transition:color .15s; -webkit-tap-highlight-color:transparent}
  .nav-btn svg{width:22px; height:22px}
  .nav-btn.on{color:var(--accent)}

  /* ---------- bottom sheet editor ---------- */
  .sheet-bg{position:fixed; inset:0; z-index:50; background:rgba(10,10,12,.45); opacity:0; pointer-events:none; transition:opacity .22s}
  .sheet-bg.open{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; z-index:51; left:50%; bottom:0; transform:translate(-50%,105%); width:100%; max-width:480px;
    background:var(--card); border-radius:22px 22px 0 0; box-shadow:var(--sheet-shadow);
    transition:transform .3s cubic-bezier(.3,1,.4,1); max-height:88dvh; display:flex; flex-direction:column;
  }
  .sheet.open{transform:translate(-50%,0)}
  .sheet-head{padding:16px 20px 12px; display:flex; align-items:center; border-bottom:1px solid var(--line)}
  .sheet-head::before{content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:40px; height:4px; border-radius:99px; background:var(--line)}
  .sheet-title{font:600 17px "Barlow",sans-serif}
  .sheet-x{margin-left:auto}
  .sheet-body{padding:16px 20px; overflow-y:auto}
  .sheet-body .act-grid{gap:8px}
  .sheet-body .act-btn{padding:10px 12px; font-size:14px; box-shadow:none}
  .sheet-foot{display:flex; gap:10px; padding:12px 20px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line)}
  .btn{flex:1; padding:13px; border-radius:12px; border:none; cursor:pointer;
    font:700 15px "Barlow",sans-serif; transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent); color:var(--on-accent)}
  .btn-primary:active{background:var(--accent-press)}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink-2); flex:0 0 auto; padding:13px 18px}
  .sheet .log-list{border:1px solid var(--line); border-radius:14px; margin-top:14px}

  .view{display:none; animation:fadein .25s ease}
  .view.on{display:block}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media (max-width:355px){ .ho-streak b{font-size:36px} }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#i-flame"/></svg>Ember</div>
    <div class="hdr-btns">
      <button class="icon-btn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-sliders"/></svg></button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-moon" id="themeIcon"/></svg></button>
    </div>
  </header>

  <!-- ============ TODAY ============ -->
  <section class="view on" id="view-today">
    <div class="hero-orange" id="heroCard"></div>
    <div class="section-t">Log today</div>
    <div class="act-grid" id="todayGrid"></div>
    <button class="save-btn" id="saveDayBtn" style="display:none"></button>
    <div id="todayLogWrap"></div>
    <div id="weightHome">
      <div class="section-t">Body weight</div>
      <div class="card w-card" id="weightCard"></div>
    </div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section class="view" id="view-settings">
    <div class="kicker">Settings</div>
    <div class="section-t">Tracking</div>
    <div class="card" id="setTrack"></div>
    <div class="section-t">Custom activities</div>
    <div class="card" id="setCustom"></div>
    <div class="hint">Turning something off hides it from logging and planning — history you already logged stays.</div>
  </section>

  <!-- ============ PLAN ============ -->
  <section class="view" id="view-plan">
    <div class="kicker">Plan</div>
    <div class="section-t">Up next</div>
    <div class="filter-row" id="planRangeRow"></div>
    <div class="card" id="upNext"></div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="view" id="view-history">
    <div class="kicker">History</div>
    <div class="section-t">Last 5 weeks</div>
    <div class="card hm-wrap">
      <div class="hm-big" id="hmGrid"></div>
    </div>

<script>
"use strict";
/* ============================================================
   EMBER — daily workout & wellness tracker
   data model:  localStorage["ember-tracker-v1"] =
     { days: { "YYYY-MM-DD": { actId: {d:<min|null>, n:"note"} } }, theme }
   ============================================================ */
const KEY = "ember-tracker-v1";

const ACTS = [
  {id:"lift",     name:"Lift",     icon:"i-lift"},
  {id:"cardio",   name:"Cardio",   icon:"i-cardio"},
  {id:"run",      name:"Run",      icon:"i-run"},
  {id:"ride",     name:"Ride",     icon:"i-ride"},
  {id:"sauna",    name:"Sauna",    icon:"i-sauna"},
  {id:"meditate", name:"Meditate", icon:"i-meditate"},
  {id:"stretch",  name:"Stretch",  icon:"i-stretch"},
  {id:"other",    name:"Other",    icon:"i-other"},
];
const BUILTIN = Object.fromEntries(ACTS.map(a=>[a.id,a]));
/* activities available for logging/planning: enabled built-ins + customs */
const activeActs = () => ACTS.filter(a=>!db.disabled.includes(a.id))
  .concat(db.custom.map(c=>({id:c.id, name:c.name, icon:"i-other"})));
/* resolve any id ever logged — built-in, custom, or archived custom */
function actOf(id){
  if(BUILTIN[id]) return BUILTIN[id];
  const c = db.custom.find(c=>c.id===id);
  if(c) return {id, name:c.name, icon:"i-other"};
  return {id, name: db.archive[id] || "Activity", icon:"i-other"};
}
const trackWeight = () => db.trackWeight !== false;

/* ---------- store ---------- */
let db = load();
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && typeof d.days==="object"){
      if(typeof d.plans!=="object" || !d.plans) d.plans = {};
      if(typeof d.weight!=="object" || !d.weight) d.weight = {};
      if(!Array.isArray(d.disabled)) d.disabled = [];
      if(!Array.isArray(d.custom)) d.custom = [];
      if(typeof d.archive!=="object" || !d.archive) d.archive = {};
      return d;
    }
  }catch(e){}
  return {days:{}, plans:{}, weight:{}, disabled:[], custom:[], archive:{}, theme:null};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }

/* ---------- date utils (local time) ---------- */
const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,dd] = k.split("-").map(Number); return new Date(y, m-1, dd); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => keyOf(new Date());
const startOfWeek = d => addDays(d, -((d.getDay()+6)%7));   /* Monday start */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function fmtLong(k){
  const d = parseKey(k);
  return d.toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric"});
}
function fmtShort(k){
  const d = parseKey(k), t = todayKey(), y = keyOf(addDays(new Date(),-1)), tm = keyOf(addDays(new Date(),1));
  if(k===t) return "Today";
  if(k===y) return "Yesterday";
  if(k===tm) return "Tomorrow";
  return d.toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"});
}

/* ---------- queries ---------- */
const dayActs = k => db.days[k] || {};
const planActs = k => db.plans[k] || {};
const actCount = k => Object.keys(dayActs(k)).length;
const has = (k, actId) => actId ? !!dayActs(k)[actId] : actCount(k) > 0;
const dayMinutes = k => Object.values(dayActs(k)).reduce((s,e)=>s+(e.d||0),0);
const wUnit = () => db.weightUnit || "lb";
const fmtW = w => (Math.round(w*10)/10).toLocaleString("en-US");
/* most recent weigh-in strictly before date k */
function prevWeighIn(k){
  const ks = Object.keys(db.weight).filter(x=>x<k).sort();
  return ks.length ? {k:ks[ks.length-1], v:db.weight[ks[ks.length-1]]} : null;
}

function currentStreak(actId){
  let d = new Date();
  if(!has(keyOf(d), actId)) d = addDays(d,-1);      /* today not logged yet ≠ broken */
  let n = 0;
  while(has(keyOf(d), actId)){ n++; d = addDays(d,-1); }
  return n;
}
function longestStreak(actId){
  const keys = Object.keys(db.days).filter(k=>has(k,actId)).sort();
  let best=0, run=0, prev=null;
  for(const k of keys){
    run = (prev && keyOf(addDays(parseKey(prev),1))===k) ? run+1 : 1;
    if(run>best) best=run;
    prev = k;
  }
  return best;
}
function countInLastDays(n, actId){
  let c=0;
  for(let i=0;i<n;i++){
    const k = keyOf(addDays(new Date(),-i));
    if(actId){ if(dayActs(k)[actId]) c++; }
    else c += actCount(k);
  }
  return c;
}
function activeDaysInLast(n){
  let c=0;
  for(let i=0;i<n;i++) if(has(keyOf(addDays(new Date(),-i)))) c++;
  return c;
}
function weeklyCounts(nWeeks, actId){
  const thisMon = startOfWeek(new Date());
  const out = [];
  for(let w=nWeeks-1; w>=0; w--){
    const mon = addDays(thisMon, -7*w);
    let sessions=0, mins=0;
    for(let i=0;i<7;i++){
      const k = keyOf(addDays(mon,i));
      const acts = dayActs(k);
      for(const id in acts){
        if(actId && id!==actId) continue;
        sessions++; mins += acts[id].d||0;
      }
    }
    out.push({label:`${mon.getMonth()+1}/${mon.getDate()}`, sessions, mins, current: w===0});
  }
  return out;
}
function monthlyCounts(nMonths){
  const now = new Date(); const out = [];
  for(let m=nMonths-1; m>=0; m--){
    const first = new Date(now.getFullYear(), now.getMonth()-m, 1);
    const next  = new Date(now.getFullYear(), now.getMonth()-m+1, 1);
    let sessions=0, mins=0;
    for(let d=new Date(first); d<next; d.setDate(d.getDate()+1)){
      const acts = dayActs(keyOf(d));
      for(const id in acts){ sessions++; mins += acts[id].d||0; }
    }
    out.push({label:MONTHS[first.getMonth()], sessions, mins});
  }
  return out;
}

/* ---------- tiny html helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (id, cls="") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#${id}"/></svg>`;

/* ============================================================
   TODAY VIEW
   ============================================================ */
let stagedIds = null;   /* unsaved tile selection for today; null = mirrors the log */

function renderToday(){
  const tk = todayKey();

  /* orange header block: date + streak, first thing you see */
  const cur = currentStreak(null);
  $("#heroCard").innerHTML = `
    <div class="ho-date">${fmtLong(tk)}</div>
    <div class="ho-streak"><b>${cur}</b>day streak</div>`;

  /* activity tiles — toggle chips, committed with the save button */
  const logged = Object.keys(dayActs(tk));
  const staged = stagedIds ?? logged.slice();
  $("#todayGrid").innerHTML = activeActs().map(a=>{
    const on = staged.includes(a.id);
    const planned = !on && !!planActs(tk)[a.id];
    return `<button class="act-btn${planned?" planned":""}" data-act="${a.id}" aria-pressed="${on}">
      ${icon(a.icon)}<span>${esc(a.name)}</span>${planned?'<small class="plan-tag">plan</small>':""}</button>`;
  }).join("");
  $("#todayGrid").querySelectorAll(".act-btn").forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.act;
      const s = stagedIds ?? Object.keys(dayActs(todayKey()));
      stagedIds = s.includes(id) ? s.filter(x=>x!==id) : [...s, id];
      renderToday();
    };
  });

  /* save button appears when the selection differs from the log */
  const dirty = staged.length!==logged.length || staged.some(id=>!logged.includes(id));
  const sb = $("#saveDayBtn");
  sb.style.display = dirty ? "" : "none";
  sb.textContent = staged.length===0 ? "Clear today"
    : `Save ${staged.length} ${staged.length===1?"activity":"activities"}`;
  sb.onclick = commitStaged;

  /* detail rows for logged activities (incl. ones since disabled) */
  const acts = dayActs(tk);
  const ids = Object.keys(acts);
  $("#todayLogWrap").innerHTML = ids.length ? `
    <div class="section-t">Details <span style="font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--ink-3)">— optional</span></div>
    <div class="card log-list">${ids.map(id=>logRow(id, acts[id])).join("")}</div>`
    : `<div class="hint">Tap activities, hit save — done in seconds.</div>`;
  bindLogRows($("#todayLogWrap"), (id,field,val)=>{
    const day = db.days[tk]; if(!day || !day[id]) return;
    day[id][field] = field==="d" ? (val===""?null:Math.max(0,parseInt(val,10)||0)) : val;
    save();
  });

  /* body weight quick entry */
  $("#weightHome").style.display = trackWeight() ? "" : "none";
  if(!trackWeight()) return;
  const w = db.weight[tk] ?? null;
  const prev = prevWeighIn(tk);
  let wSub;
  if(w!=null && prev){
    const diff = Math.round((w - prev.v)*10)/10;
    wSub = diff===0 ? `No change since ${fmtShort(prev.k)}`
      : `<b>${diff>0?"+":"−"}${fmtW(Math.abs(diff))} ${wUnit()}</b> since ${fmtShort(prev.k)}`;
  } else if(prev){
    wSub = `Last: ${fmtW(prev.v)} ${wUnit()} · ${fmtShort(prev.k)}`;
  } else {
    wSub = w!=null ? "First weigh-in logged" : "Log your first weigh-in";
  }
  $("#weightCard").innerHTML = `
    ${icon("i-scale")}
    <input id="weightInput" type="number" inputmode="decimal" step="0.1" min="0" max="1500" placeholder="—" value="${w??""}" aria-label="Body weight">
    <button class="w-unit" id="unitBtn" aria-label="Toggle weight unit">${wUnit()}</button>
    <span class="w-sub">${wSub}</span>`;
  const wi = $("#weightInput");
  wi.oninput = ()=>{
    const v = parseFloat(wi.value);
    if(wi.value!=="" && isFinite(v) && v>0 && v<1500) db.weight[tk] = Math.round(v*10)/10;
    else delete db.weight[tk];
    save();
  };
  wi.onchange = ()=> renderToday();
  $("#unitBtn").onclick = ()=>{ db.weightUnit = wUnit()==="lb" ? "kg" : "lb"; save(); renderToday(); renderTrends(); };
}

/* ============================================================
   PLAN VIEW  (up next — schedule the coming days)
   ============================================================ */
function renderPlan(){
  const range = [7,14,30].includes(db.planRange) ? db.planRange : 7;
  $("#planRangeRow").innerHTML = [7,14,30].map(n=>
    `<button class="f-chip" data-n="${n}" aria-pressed="${n===range}">${n} days</button>`).join("");
  $("#planRangeRow").querySelectorAll(".f-chip").forEach(b=>{
    b.onclick = ()=>{ db.planRange = Number(b.dataset.n); save(); renderPlan(); };
  });
  $("#upNext").innerHTML = Array.from({length:range},(_,i)=>{
    const k = keyOf(addDays(new Date(), i+1));
    const plan = planActs(k);
    const chips = Object.keys(plan).map(id=>{
      const a = actOf(id), e = plan[id];
      return `<span class="a-chip plan">${esc(a.name)}${e.d?`<small> · ${e.d} min</small>`:""}</span>`;
    }).join("");
    return `<button class="plan-row" data-k="${k}" aria-label="Plan ${fmtShort(k)}">
      <span class="pr-date">${fmtShort(k)}</span>
      <span class="pr-chips">${chips || '<span class="pr-none">Rest — tap to plan</span>'}</span>
      ${icon("i-pencil","pr-edit")}
    </button>`;
  }).join("");
  $("#upNext").querySelectorAll(".plan-row").forEach(b=> b.onclick = ()=> openEditor(b.dataset.k));
}

function logRow(id, e){
  const a = actOf(id);
  return `<div class="log-row" data-act="${id}">
    ${icon(a.icon)}<span class="nm">${a.name}</span>
    <input class="dur" type="number" inputmode="numeric" min="0" placeholder="—" value="${e.d??""}" aria-label="${a.name} minutes"><span class="un">min</span>
    <input class="note" type="text" maxlength="120" placeholder="Add a note" value="${esc(e.n||"")}" aria-label="${a.name} note">
  </div>`;
}
function bindLogRows(root, onChange){
  root.querySelectorAll(".log-row").forEach(r=>{
    r.querySelector(".dur").oninput  = ev => onChange(r.dataset.act, "d", ev.target.value);
    r.querySelector(".note").oninput = ev => onChange(r.dataset.act, "n", ev.target.value);
  });
}

function commitStaged(){
  const tk = todayKey();
  const cur = dayActs(tk), next = {};
  (stagedIds||[]).forEach(id=>{
    const p = planActs(tk)[id];              /* planned? logging it carries the intent */
    next[id] = cur[id] || (p ? {d:p.d, n:p.n} : {d:null, n:""});
  });
  if(Object.keys(next).length) db.days[tk] = next; else delete db.days[tk];
  stagedIds = null;
  save(); renderAll();
}

/* ============================================================
   HISTORY VIEW
   ============================================================ */
function renderHistory(){
  /* ---- heatmap: last 5 weeks, one row per week, Mon–Sun ---- */
  const tk = todayKey();
  const thisMon = startOfWeek(new Date());
  let cells = "";
  for(let w=4; w>=0; w--){
    const mon = addDays(thisMon, -7*w);
    for(let i=0;i<7;i++){
      const k = keyOf(addDays(mon,i));
      const n = actCount(k);
      const lvl = n===0?0 : n===1?1 : n===2?2 : n===3?3 : 4;
      const future = k > tk;
      const planned = future && Object.keys(planActs(k)).length > 0;
      cells += `<button class="hm-cell ${lvl?("l"+lvl):""} ${k===tk?"today":""} ${future?"future":""} ${planned?"planned":""}"
        data-k="${k}" title="${fmtShort(k)} — ${planned?"planned":`${n} ${n===1?"activity":"activities"}`}"
        aria-label="${fmtShort(k)}, ${planned?"planned":n+" activities"}"${future && !planned?" disabled":""}></button>`;
    }
  }
  $("#hmGrid").innerHTML = cells;
  $("#hmGrid").querySelectorAll(".hm-cell:not([disabled])").forEach(c=>{
    c.onclick = ()=> openEditor(c.dataset.k);
  });

  /* ---- date picker: past dates edit the log, future dates open a plan ---- */
  const bf = $("#backfillDate");
  bf.max = keyOf(addDays(new Date(), 365));
  bf.value = "";
  bf.onchange = ()=>{ if(bf.value && bf.value <= bf.max) openEditor(bf.value); };

  /* ---- feed ---- */
  const keys = Object.keys(db.days).filter(k=>actCount(k)>0 && k<=tk).sort().reverse().slice(0,60);
  if(!keys.length){
    $("#feed").innerHTML = `<div class="card empty">${icon("i-flame")}<b>No activity yet</b>Log today or backfill a past day above.</div>`;
    return;
  }
  $("#feed").innerHTML = keys.map(k=>{
    const acts = dayActs(k);
    const mins = dayMinutes(k);
    const chips = Object.keys(acts).map(id=>{
      const a = actOf(id), e = acts[id];
      return `<span class="a-chip">${esc(a.name)}${e.d?`<small> · ${e.d} min</small>`:""}</span>`;
    }).join("");
    const notes = Object.keys(acts).filter(id=>acts[id].n).map(id=>
      `<div class="day-note"><b>${esc(actOf(id).name)}:</b> ${esc(acts[id].n)}</div>`).join("");
    const missed = Object.keys(planActs(k)).filter(id=>!acts[id]).map(id=>esc(actOf(id).name));
    const missedLine = missed.length ? `<div class="day-note miss">Planned: ${missed.join(", ")} — not logged</div>` : "";
    return `<div class="card day-card">
      <div class="day-head">
        <span class="day-date">${fmtShort(k)}</span>
        <span class="day-meta">${Object.keys(acts).length} ${Object.keys(acts).length===1?"activity":"activities"}${mins?` · ${mins} min`:""}${trackWeight() && db.weight[k]!=null?` · ${fmtW(db.weight[k])} ${wUnit()}`:""}</span>
        <button class="day-edit" data-k="${k}" aria-label="Edit ${fmtShort(k)}">${icon("i-pencil")}</button>
      </div>
      <div class="chips">${chips}</div>${notes}${missedLine}
    </div>`;
  }).join("");
  $("#feed").querySelectorAll(".day-edit").forEach(b=> b.onclick = ()=> openEditor(b.dataset.k));
}

/* ============================================================
   TRENDS VIEW
   ============================================================ */
let trendFilter = null;   /* null = all activities */

function renderTrends(){
  const cur = currentStreak(null), best = Math.max(longestStreak(null), cur);
  const consist = Math.round(activeDaysInLast(30)/30*100);
  const mo = monthlyCounts(1)[0];

  $("#tiles").innerHTML = [
    {lab:"Current", num:cur, o:true, sub:cur===1?"day streak":"day streak"},
    {lab:"Longest", num:best, sub:"day streak"},
    {lab:"Consistency", num:consist+"%", sub:`${activeDaysInLast(30)} of last 30 days`},
    {lab:"This month", num:mo.sessions, sub:mo.mins?`sessions · ${fmtMins(mo.mins)}`:"sessions"},
  ].map(t=>`<div class="tile">
      <div class="t-lab">${t.lab}</div>
      <div class="t-num${t.o?" o":""}">${t.num}</div>
      <div class="t-sub">${t.sub}</div>
    </div>`).join("");

  /* filter chips */
  $("#filterRow").innerHTML =
    `<button class="f-chip" data-f="" aria-pressed="${trendFilter===null}">All</button>` +
    activeActs().map(a=>`<button class="f-chip" data-f="${a.id}" aria-pressed="${trendFilter===a.id}">${esc(a.name)}</button>`).join("");
  $("#filterRow").querySelectorAll(".f-chip").forEach(b=>{
    b.onclick = ()=>{ trendFilter = b.dataset.f || null; renderTrends(); };
  });

  $("#weeklyChart").innerHTML = barChartSVG(weeklyCounts(8, trendFilter));

  /* body weight trend (last 90 days of weigh-ins) */
  $("#weightTrendWrap").style.display = trackWeight() ? "" : "none";
  const wKeys = Object.keys(db.weight).sort();
  if(!wKeys.length){
    $("#weightTrend").innerHTML = `<div class="empty" style="padding:18px 20px">${icon("i-scale")}<b>No weigh-ins yet</b>Log your weight on the Today tab.</div>`;
  } else {
    const cutoff = keyOf(addDays(new Date(),-89));
    const pts = wKeys.filter(k=>k>=cutoff).map(k=>({k, v:db.weight[k]}));
    const cur = db.weight[wKeys[wKeys.length-1]];
    const base = pts.length ? pts[0].v : cur;
    const diff = Math.round((cur - base)*10)/10;
    $("#weightTrend").innerHTML = `
      <div class="wt-head">
        <div><div class="t-lab">Current</div><div class="t-num">${fmtW(cur)}<small> ${wUnit()}</small></div></div>
        <div class="wt-diff">${diff===0?"±0":(diff>0?"+":"−")+fmtW(Math.abs(diff))} ${wUnit()}<span>last 90 days</span></div>
      </div>
      ${pts.length>1 ? weightChartSVG(pts)
        : `<div class="hint" style="margin:8px 0 2px">One weigh-in so far — the trend line appears with your next.</div>`}`;
  }

  /* monthly volume */
  const months = monthlyCounts(6);
  const mMax = Math.max(1, ...months.map(m=>m.sessions));
  $("#monthList").innerHTML = months.map(m=>`
    <div class="m-row">
      <span class="nm">${m.label}</span>
      <div class="meter"><i style="width:${Math.round(m.sessions/mMax*100)}%"></i></div>
      <span class="v">${m.sessions===0 ? "—" : m.sessions + (m.mins ? " · "+fmtMins(m.mins) : " sessions")}</span>
    </div>`).join("");

  /* by activity: 30-day session split with per-activity streaks */
  const rows = activeActs().map(a=>({a, n:countInLastDays(30,a.id), s:currentStreak(a.id)}))
    .sort((x,y)=>y.n-x.n);
  const mx = Math.max(1, ...rows.map(r=>r.n));
  $("#streakTable").innerHTML = rows.map(({a,n,s})=>`
    <div class="m-row">
      <span class="ba-nm">${esc(a.name)}${s>0?`<small>${s}-day streak</small>`:""}</span>
      <div class="meter"><i style="width:${Math.round(n/mx*100)}%"></i></div>
      <span class="ba-v">${n}</span>
    </div>`).join("");
}
const fmtMins = m => m>=60 ? `${Math.floor(m/60)}h ${m%60?`${m%60}m`:""}`.trim() : `${m}m`;

/* flat single-series bars, orange with a pale in-progress current week; detail in tooltips */
function barChartSVG(data){
  const W=440, H=150, padL=4, padR=4, padT=10, padB=6;
  const plotW = W-padL-padR, plotH = H-padT-padB, baseY = H-padB;
  const n = data.length, gap = 10, bw = Math.floor((plotW - gap*(n-1))/n);
  const max = Math.max(1, ...data.map(d=>d.sessions));
  let bars="";
  data.forEach((d,i)=>{
    const x = padL + i*(bw+gap);
    const h = Math.round(d.sessions/max*plotH);
    const y = baseY - h;
    const r = Math.min(5, bw/2, h);
    const tip = `Week of ${d.label}${d.current?" (this week)":""} — ${d.sessions} session${d.sessions===1?"":"s"}${d.mins?`, ${fmtMins(d.mins)}`:""}`;
    if(d.sessions>0){
      bars += `<path class="bar${d.current?" cur":""}" d="M${x} ${baseY} V${y+r} Q${x} ${y} ${x+r} ${y} H${x+bw-r} Q${x+bw} ${y} ${x+bw} ${y+r} V${baseY} Z"><title>${tip}</title></path>`;
    } else {
      bars += `<rect class="bar-stub" x="${x}" y="${baseY-4}" width="${bw}" height="4" rx="2"><title>${tip}</title></rect>`;
    }
  });
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sessions per week, last 8 weeks, newest on the right">${bars}</svg>`;
}

/* single-series weight line, orange, dot per weigh-in, gridlines at data min/max */
function weightChartSVG(pts){
  const W=440, H=150, padL=40, padR=16, padT=14, padB=24;
  const t0=parseKey(pts[0].k).getTime(), t1=parseKey(pts[pts.length-1].k).getTime();
  const vs=pts.map(p=>p.v);
  const loV=Math.min(...vs), hiV=Math.max(...vs);
  let lo=loV, hi=hiV;
  if(hi-lo<1){ const m=(hi+lo)/2; lo=m-0.5; hi=m+0.5; }
  const span=hi-lo; lo-=span*0.2; hi+=span*0.2;
  const x=t=> t1===t0 ? (padL+(W-padL-padR)/2) : padL+(t-t0)/(t1-t0)*(W-padL-padR);
  const y=v=> padT+(hi-v)/(hi-lo)*(H-padT-padB);
  const path=pts.map((p,i)=>`${i?"L":"M"}${x(parseKey(p.k).getTime()).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const dots=pts.map(p=>`<circle class="wt-dot" cx="${x(parseKey(p.k).getTime()).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3"><title>${fmtShort(p.k)} — ${fmtW(p.v)} ${wUnit()}</title></circle>`).join("");
  const last=pts[pts.length-1];
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight over time">
    <line class="gridline" x1="${padL}" y1="${y(hiV)}" x2="${W-padR}" y2="${y(hiV)}"/>
    <line class="gridline" x1="${padL}" y1="${y(loV)}" x2="${W-padR}" y2="${y(loV)}"/>
    <text class="ax" x="${padL-6}" y="${y(hiV)+3.5}" text-anchor="end">${fmtW(hiV)}</text>
    <text class="ax" x="${padL-6}" y="${y(loV)+3.5}" text-anchor="end">${fmtW(loV)}</text>
    <text class="ax" x="${padL}" y="${H-7}" text-anchor="start">${fmtShort(pts[0].k)}</text>
    <text class="ax" x="${W-padR}" y="${H-7}" text-anchor="end">${fmtShort(last.k)}</text>
    <path class="wt-line" d="${path}"/>
    ${dots}
    <circle class="wt-dot-last" cx="${x(parseKey(last.k).getTime()).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="4.5"><title>${fmtShort(last.k)} — ${fmtW(last.v)} ${wUnit()}</title></circle>
  </svg>`;
}

/* ============================================================
   EDITOR SHEET  (backfill / correct any day)
   ============================================================ */
let editorKey=null, draft=null, editorIsPlan=false, draftW=null;

function openEditor(k){
  editorKey = k;
  editorIsPlan = k > todayKey();
  draft = JSON.parse(JSON.stringify(editorIsPlan ? planActs(k) : dayActs(k)));
  draftW = editorIsPlan ? null : (db.weight[k] ?? null);
  $("#sheetTitle").textContent = (editorIsPlan ? "Plan — " : "") + (fmtShort(k)==="Today" ? "Today" : fmtLong(k));
  $("#sheetSave").textContent = editorIsPlan ? "Save plan" : "Save day";
  renderSheet();
  $("#sheetBg").classList.add("open");
  $("#sheet").classList.add("open");
}
function renderSheet(){
  /* active activities, plus any already on this day even if since disabled/removed */
  const opts = activeActs();
  Object.keys(draft).forEach(id=>{ if(!opts.some(a=>a.id===id)) opts.push(actOf(id)); });
  $("#sheetGrid").innerHTML = opts.map(a=>{
    const on = !!draft[a.id];
    return `<button class="act-btn" data-act="${a.id}" aria-pressed="${on}">
      ${icon(a.icon)}<span>${esc(a.name)}</span></button>`;
  }).join("");
  $("#sheetGrid").querySelectorAll(".act-btn").forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.act;
      if(draft[id]) delete draft[id]; else draft[id] = {d:null, n:""};
      renderSheet();
    };
  });
  const ids = ACTS.filter(a=>draft[a.id]).map(a=>a.id);
  $("#sheetLogWrap").innerHTML = ids.length
    ? `<div class="log-list">${ids.map(id=>logRow(id, draft[id])).join("")}</div>` : "";
  bindLogRows($("#sheetLogWrap"), (id,field,val)=>{
    if(!draft[id]) return;
    draft[id][field] = field==="d" ? (val===""?null:Math.max(0,parseInt(val,10)||0)) : val;
  });
  $("#sheetWeightWrap").innerHTML = (editorIsPlan || !trackWeight()) ? "" : `
    <div class="log-list" style="margin-top:14px"><div class="log-row">
      ${icon("i-scale")}<span class="nm">Weight</span>
      <input class="dur wd" type="number" inputmode="decimal" step="0.1" min="0" max="1500" placeholder="—" value="${draftW??""}" aria-label="Body weight"><span class="un">${wUnit()}</span>
      <span style="flex:1"></span>
    </div></div>`;
  const wd = $("#sheetWeightWrap .wd");
  if(wd) wd.oninput = ()=>{
    const v = parseFloat(wd.value);
    draftW = (wd.value!=="" && isFinite(v) && v>0 && v<1500) ? Math.round(v*10)/10 : null;
  };
}
function closeEditor(){
  $("#sheetBg").classList.remove("open");
  $("#sheet").classList.remove("open");
  editorKey = null; draft = null;
}
$("#sheetSave").onclick = ()=>{
  const target = editorIsPlan ? db.plans : db.days;
  if(Object.keys(draft).length) target[editorKey] = draft;
  else delete target[editorKey];
  if(!editorIsPlan){
    if(draftW!=null) db.weight[editorKey] = draftW;
    else delete db.weight[editorKey];
  }
  save(); closeEditor(); renderAll();
};
$("#sheetClear").onclick = ()=>{ draft = {}; draftW = null; renderSheet(); };
$("#sheetClose").onclick = closeEditor;
$("#sheetBg").onclick = closeEditor;

/* ============================================================
   SETTINGS  (choose what to track)
   ============================================================ */
function renderSettings(){
  $("#setTrack").innerHTML = `
    <div class="set-row">${icon("i-scale")}<span class="nm">Body weight</span>
      <button class="sw" role="switch" aria-checked="${trackWeight()}" data-weight="1" aria-label="Track body weight"></button>
    </div>` +
    ACTS.map(a=>`
    <div class="set-row">${icon(a.icon)}<span class="nm">${a.name}</span>
      <button class="sw" role="switch" aria-checked="${!db.disabled.includes(a.id)}" data-act="${a.id}" aria-label="Track ${a.name}"></button>
    </div>`).join("");
  $("#setTrack").querySelectorAll(".sw").forEach(s=>{
    s.onclick = ()=>{
      if(s.dataset.weight) db.trackWeight = !trackWeight();
      else {
        const id = s.dataset.act;
        db.disabled = db.disabled.includes(id) ? db.disabled.filter(x=>x!==id) : [...db.disabled, id];
      }
      save(); renderAll();
    };
  });

  $("#setCustom").innerHTML = db.custom.map(c=>`
    <div class="set-row">${icon("i-other")}<span class="nm">${esc(c.name)}</span>
      <button class="x-btn" data-del="${c.id}" aria-label="Remove ${esc(c.name)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>`).join("") + `
    <div class="set-row add-row">
      <input id="newActName" type="text" maxlength="18" placeholder="e.g. Cold plunge, Yoga, Read…" aria-label="New activity name">
      <button class="add-btn" id="addActBtn">Add</button>
    </div>`;
  $("#setCustom").querySelectorAll(".x-btn").forEach(b=> b.onclick = ()=> removeCustom(b.dataset.del));
  const addIt = ()=>{
    const name = $("#newActName").value.replace(/[<>&"']/g,"").trim().slice(0,18);
    if(!name) return;
    db.custom.push({id:"c"+Date.now().toString(36), name});
    save(); renderAll();
  };
  $("#addActBtn").onclick = addIt;
  $("#newActName").onkeydown = e=>{ if(e.key==="Enter") addIt(); };
}
function removeCustom(id){
  const used = [...Object.values(db.days), ...Object.values(db.plans)].some(day=>day[id]);
  const c = db.custom.find(x=>x.id===id);
  if(used && c) db.archive[id] = c.name;      /* keep the name for history rendering */
  db.custom = db.custom.filter(x=>x.id!==id);
  save(); renderAll();
}

/* ============================================================
   NAV + THEME + BOOT
   ============================================================ */
const renderers = {today:renderToday, plan:renderPlan, history:renderHistory, trends:renderTrends, settings:renderSettings};
function renderAll(){ stagedIds = null; renderToday(); renderPlan(); renderHistory(); renderTrends(); renderSettings(); }

function showView(name){
  document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("on", x.dataset.view===name));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  $("#view-"+name).classList.add("on");
  renderers[name]();
  window.scrollTo({top:0});
}
document.querySelectorAll(".nav-btn").forEach(b=>{ b.onclick = ()=> showView(b.dataset.view); });
$("#settingsBtn").onclick = ()=> showView($("#view-settings").classList.contains("on") ? "today" : "settings");

function applyTheme(){
  const pref = db.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = pref;
  $("#themeIcon").setAttribute("href", pref==="dark" ? "#i-sun" : "#i-moon");
  document.querySelector('meta[name="theme-color"]').content = pref==="dark" ? "#1A1A1C" : "#FC5200";
}
$("#themeBtn").onclick = ()=>{
  const cur = document.documentElement.dataset.theme;
  db.theme = cur==="dark" ? "light" : "dark";
  save(); applyTheme();
};

/* re-render when the date rolls over or tab regains focus */
let lastDay = todayKey();
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && todayKey()!==lastDay){ lastDay = todayKey(); renderAll(); }
});

applyTheme();
renderAll();
</script>
